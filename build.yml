name: Build Conrad Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller urllib3

    - name: Build Standalone Windows GUI Executable
      run: |
        pyinstaller --noconsole --onefile --name "ConradCategorizer" conrad_app.py

    - name: Upload ConradCategorizer.exe
      uses: actions/upload-artifact@v4
      with:
        name: ConradCategorizer-Windows
        path: dist/ConradCategorizer.exe
